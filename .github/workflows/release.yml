name: Build and Release Windows App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            ~\.cargo\git\db
            src-tauri\target
          key: ${{ runner.os }}-cargo-msvc-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msvc-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Clean previous NSIS bundles
        # Tauri never cleans the bundle dir; without this, cached older
        # installers would be uploaded into every new Release.
        shell: pwsh
        run: |
          $nsis = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          if (Test-Path $nsis) { Remove-Item $nsis -Recurse -Force }
          Write-Host "Cleaned $nsis"

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Create portable archive
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Upload Windows artifacts
        # Artifacts are only consumed by the tag-triggered publish job;
        # branch runs just build and test.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: music-auto-sync-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Music Auto Sync_${{ replace(github.ref_name, 'v', '') }}_x64-setup.exe
            release/music-auto-sync_x64_portable.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: music-auto-sync-windows-${{ github.ref_name }}
          path: release-assets

      - name: Read changelog section
        id: changelog
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          $lines = Get-Content -LiteralPath CHANGELOG.md
          $heading = "## [$version]"
          $start = [Array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($line) $line.StartsWith($heading) })
          if ($start -lt 0) {
            throw "CHANGELOG.md does not contain a section headed '$heading'."
          }

          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^## ') {
              $end = $index
              break
            }
          }

          $notes = ($lines[$start..($end - 1)] -join "`n").Trim()
          "notes<<EOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            release-assets/**/Music Auto Sync_${{ replace(github.ref_name, 'v', '') }}_x64-setup.exe
            release-assets/**/music-auto-sync_x64_portable.zip
